name: Release Charts

# Ne publie qu'après un passage réussi de « Helm Chart Tests » sur main : un
# chart qui ne passe pas lint/unittest/kubeconform n'est jamais releasé.
on:
  workflow_run:
    workflows: ["Helm Chart Tests"]
    types: [completed]
    branches:
      - main

jobs:
  release:
    # `event == 'push'` écarte les runs de PR dont la branche source s'appelle
    # elle aussi `main` (cas d'un fork).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    permissions:
      contents: write
    runs-on: dou-s-home-arc-helm-charts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.8.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"
          # Corps des releases GitHub. Sans ça, chart-releaser retombe sur la
          # `description` du Chart.yaml. Le fichier est lu depuis le paquet, pas
          # depuis le dépôt : il doit donc rester hors du .helmignore.
          CR_RELEASE_NOTES_FILE: CHANGELOG.md