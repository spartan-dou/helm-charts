name: Release Charts

on:
  push:
    branches:
      - main

jobs:
  release:
    permissions:
      contents: write
    runs-on: dou-s-home-arc-helm-charts
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: add repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          CR_SKIP_EXISTING: "true"
          # Corps des releases GitHub. Sans ça, chart-releaser retombe sur la
          # `description` du Chart.yaml. Le fichier est lu depuis le paquet, pas
          # depuis le dépôt : il doit donc rester hors du .helmignore.
          CR_RELEASE_NOTES_FILE: CHANGELOG.md