name: Helm Chart Tests

on:
  pull_request:
    paths:
      - 'charts/**'
  push:
    branches:
      - main
      # Renovate n'automerge une branche que si ses checks sont verts : il faut
      # donc que les tests tournent aussi sur ses branches.
      - 'renovate/**'

env:
  # renovate: datasource=github-releases depName=yannh/kubeconform
  KUBECONFORM_VERSION: v0.7.0

jobs:
  helm-tests:
    # Runner hébergé par GitHub, pas le runner du cluster : ce workflow se
    # déclenche sur `pull_request`, donc aussi sur le code d'un fork.
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.1

      - name: Install helm-unittest plugin
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false --version v1.0.3

      - name: Run Helm lint
        run: helm lint charts/commons

      - name: Run Helm unit tests
        run: helm unittest charts/commons

      - name: Install kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" kubeconform
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate rendered manifests against the Kubernetes schema (default values)
        run: |
          helm template test charts/commons \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0

      - name: Validate rendered manifests against the Kubernetes schema (full test values)
        run: |
          helm template test charts/commons -f charts/commons/tests/values/values.yaml \
            | kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.31.0
