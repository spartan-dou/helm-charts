suite: Test CronJob template
values:
  - ./values/values.yaml
templates:
  - templates/job.yaml
release:
  name: test
tests:
  - it: Vérifie le cron
    documentSelector:
      path: metadata.name
      value: test-nginx
    asserts:
      - equal:
          path: kind
          value: Job
      - equal:
          path: spec.template.spec.containers[0].image
          value: "nginx:latest"

  - it: ne crée un Job que pour les cronjobs avec runOnStartup (pas pour toto)
    asserts:
      - hasDocuments:
          count: 1