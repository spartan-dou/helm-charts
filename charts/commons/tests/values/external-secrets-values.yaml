# Fixture dédiée aux références vers des Secrets externes.
#
# Aucun mot de passe n'apparaît ici : uniquement des alias vers des Secrets déjà
# présents dans le namespace (SealedSecret, ExternalSecret, kubectl create
# secret…). `helm get values` ne révèle donc que des noms de Secrets.
secrets:
  pg:
    existingSecret: app-pg-credentials
    # `key` est ignoré par CloudNativePG, qui attend un Secret basic-auth
    # (clés `username` + `password`) — précisé ici pour vérifier ce cas.
    key: password
  redis:
    existingSecret: app-redis-credentials
    key: redis-password
  pgadmin:
    existingSecret: app-pgadmin-credentials
    key: admin-password
  appApiKey:
    existingSecret: app-third-party
    key: api-token

components:
  - name: app
    deployment:
      containers:
        - image:
            repository: nginx
            tag: latest
          env:
            # Raccourci : alias -> valueFrom.secretKeyRef
            - name: API_KEY
              secretRef: appApiKey
            # Forme longue, quand seul le nom du Secret est nécessaire
            - name: PG_SECRET_NAME
              value: __secrets__pg__name
            - name: PG_SECRET_KEY
              value: __secrets__pg__key
            # Le placeholder existant pointe vers le Secret externe
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: __components__postgres__password_secret
                  key: password
    cronjobs:
      - schedule: '0 3 * * *'
        enabled: true
        containers:
          - image:
              repository: nginx
              tag: latest
            env:
              - name: API_KEY
                secretRef: appApiKey
    postgres:
      enabled: true
      cluster:
        username: appuser
        secretRef: pg

addons:
  redis:
    enabled: true
    passwordSecretRef: redis
  pgadmin:
    enabled: true
    auth:
      email: admin@test.com
      passwordSecretRef: pgadmin
  postgres:
    enabled: true
    cluster:
      username: sharedadmin
      secretRef: pg
