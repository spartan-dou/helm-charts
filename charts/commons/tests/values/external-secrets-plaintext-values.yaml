# Variante invalide : on tente de lire le mot de passe en clair alors que le
# cluster pointe sur un Secret externe. Le rendu doit échouer explicitement.
secrets:
  pg:
    existingSecret: app-pg-credentials

components:
  - name: app
    deployment:
      containers:
        - image:
            repository: nginx
            tag: latest
          env:
            - name: PG_PASSWORD
              value: __components__postgres__password
    postgres:
      enabled: true
      cluster:
        username: appuser
        secretRef: pg
