# Fixture dédiée à la section `secrets` : couvre tous les points d'injection
# où une valeur `__secrets__<clé>` doit être résolue.
#
# En usage réel, cette section `secrets` vit dans un fichier chiffré (SOPS) et
# le reste des values reste en clair dans git :
#   helm secrets -f values.yaml -f secrets.yaml
secrets:
  pgPassword: pg-s3cr3t
  redisPassword: redis-s3cr3t
  pgadminPassword: pgadmin-s3cr3t
  appApiKey: api-s3cr3t

components:
  - name: app
    secrets:
      - name: creds
        data:
          apiKey: __secrets__appApiKey
          plain: not-a-secret
    deployment:
      containers:
        - image:
            repository: nginx
            tag: latest
          env:
            # Référence directe à la section `secrets`
            - name: API_KEY_INLINE
              value: __secrets__appApiKey
            # Référence indirecte : le placeholder postgres pointe lui-même
            # sur un `__secrets__…` dans les values
            - name: PG_PASSWORD_INDIRECT
              value: __components__postgres__password
            # Le pattern recommandé : passer par le Secret généré
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: __components__secret__creds
                  key: apiKey
    postgres:
      enabled: true
      cluster:
        username: appuser
        password: __secrets__pgPassword

addons:
  redis:
    enabled: true
    password: __secrets__redisPassword
  pgadmin:
    enabled: true
    auth:
      email: admin@test.com
      password: __secrets__pgadminPassword
  postgres:
    enabled: true
    cluster:
      username: sharedadmin
      # Volontairement en clair : prouve que le passthrough reste intact
      password: plain-not-placeholder
