# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Tests complets du chart commons
values:
  - ./values/values.yaml
release:
  name: test
tests:
  # --- Cluster CNPG ---
  - it: Vérifie le Cluster Postgres
    templates:
      - templates/cnpg/cluster.yaml
    documentSelector:
      path: metadata.name
      value: test-nginx-postgres
    asserts:
      - equal:
          path: spec.instances
          value: 1
      - equal:
          path: spec.imageName
          value: ghcr.io/cloudnative-pg/postgresql:16

  - it: Vérifie le Cluster Postgres global
    templates:
      - templates/cnpg/cluster.yaml
    documentSelector:
      path: metadata.name
      value: test-postgres
    asserts:
      - equal:
          path: spec.instances
          value: 1
      - equal:
          path: spec.imageName
          value: ghcr.io/cloudnative-pg/postgresql:16

  - it: Gère plusieurs clusters Postgres embarqués sans collision de nom (app-a)
    templates:
      - templates/cnpg/cluster.yaml
    set:
      components:
        - name: app-a
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
          postgres:
            enabled: true
            cluster:
              username: user-a
              password: pass-a
        - name: app-b
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
          postgres:
            enabled: true
            cluster:
              username: user-b
              password: pass-b
    documentSelector:
      path: metadata.name
      value: test-app-a-postgres
    asserts:
      - equal:
          path: spec.bootstrap.initdb.owner
          value: user-a

  - it: Gère plusieurs clusters Postgres embarqués sans collision de nom (app-b)
    templates:
      - templates/cnpg/cluster.yaml
    set:
      components:
        - name: app-a
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
          postgres:
            enabled: true
            cluster:
              username: user-a
              password: pass-a
        - name: app-b
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
          postgres:
            enabled: true
            cluster:
              username: user-b
              password: pass-b
    documentSelector:
      path: metadata.name
      value: test-app-b-postgres
    asserts:
      - equal:
          path: spec.bootstrap.initdb.owner
          value: user-b

  # --- PodMonitor (spec.monitoring.enablePodMonitor) ---
  #
  # `postgres.monitoring` était lu par le template mais absent de values.yaml,
  # de values.schema.json et de ces tests : la seule façon de le découvrir
  # était de lire cluster.yaml. Il pouvait donc disparaître sans qu'aucun test
  # ne bronche, et une base cesse d'être scrapée sans erreur nulle part.
  - it: Ne crée pas de PodMonitor par défaut
    templates:
      - templates/cnpg/cluster.yaml
    documentSelector:
      path: metadata.name
      value: test-postgres
    asserts:
      - equal:
          path: spec.monitoring.enablePodMonitor
          value: false

  - it: Active le PodMonitor sur l'addon postgres
    templates:
      - templates/cnpg/cluster.yaml
    set:
      addons.postgres.monitoring: true
    documentSelector:
      path: metadata.name
      value: test-postgres
    asserts:
      - equal:
          path: spec.monitoring.enablePodMonitor
          value: true

  - it: Active le PodMonitor sur un postgres embarqué dans un component
    templates:
      - templates/cnpg/cluster.yaml
    set:
      components:
        - name: app-a
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
          postgres:
            enabled: true
            monitoring: true
            cluster:
              username: user-a
              password: pass-a
    documentSelector:
      path: metadata.name
      value: test-app-a-postgres
    asserts:
      - equal:
          path: spec.monitoring.enablePodMonitor
          value: true

  - it: N'active pas le PodMonitor d'un component quand seul l'addon l'active
    templates:
      - templates/cnpg/cluster.yaml
    set:
      addons.postgres.monitoring: true
      components:
        - name: app-a
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
          postgres:
            enabled: true
            cluster:
              username: user-a
              password: pass-a
    documentSelector:
      path: metadata.name
      value: test-app-a-postgres
    asserts:
      - equal:
          path: spec.monitoring.enablePodMonitor
          value: false
