# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Références vers des Secrets externes (section `secrets`)
values:
  - ./values/external-secrets-values.yaml
release:
  name: test
tests:
  # --- Aucun secret produit par la chart ---
  - it: Ne génère aucun Secret Postgres quand `cluster.secretRef` est utilisé
    templates:
      - templates/cnpg/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: Ne génère aucun Secret Redis quand `passwordSecretRef` est utilisé
    templates:
      - templates/secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  # --- CloudNativePG pointe sur le Secret externe ---
  - it: Bootstrappe le cluster embarqué depuis le Secret externe
    templates:
      - templates/cnpg/cluster.yaml
    documentSelector:
      path: metadata.name
      value: test-app-postgres
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: app-pg-credentials
      - equal:
          path: spec.bootstrap.initdb.owner
          value: appuser

  - it: Bootstrappe le cluster partagé depuis le Secret externe
    templates:
      - templates/cnpg/cluster.yaml
    documentSelector:
      path: metadata.name
      value: test-postgres
    asserts:
      - equal:
          path: spec.bootstrap.initdb.secret.name
          value: app-pg-credentials

  # --- Raccourci `secretRef` dans les env ---
  - it: Transforme `secretRef` en secretKeyRef dans un deployment
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: test-app
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: app-third-party
                key: api-token
      # Placeholders `__secrets__<alias>__name` / `__key`
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_SECRET_NAME
            value: app-pg-credentials
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_SECRET_KEY
            value: password
      # Le placeholder historique pointe désormais sur le Secret externe
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-pg-credentials
                key: password

  - it: Transforme `secretRef` en secretKeyRef dans un cronjob
    templates:
      - templates/cronjob.yaml
    asserts:
      - contains:
          path: spec.jobTemplate.spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: app-third-party
                key: api-token

  # --- Redis ---
  - it: Fait pointer Redis et son initContainer sur le Secret externe
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: test-redis
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-redis-credentials
                key: redis-password
      - contains:
          path: spec.template.spec.containers[0].args
          content: --requirepass

  - it: Propage la clé personnalisée dans l'initContainer wait-for-redis
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: test-app
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: REDIS_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-redis-credentials
                key: redis-password

  # --- pgAdmin ---
  - it: Injecte le mot de passe pgAdmin par référence, jamais en clair
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: test-pgadmin
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGADMIN_DEFAULT_PASSWORD
            valueFrom:
              secretKeyRef:
                name: app-pgadmin-credentials
                key: admin-password
      - contains:
          path: spec.template.spec.initContainers[0].env
          content:
            name: PGPASS_PWD_0
            valueFrom:
              secretKeyRef:
                name: app-pg-credentials
                key: password

  - it: Ne laisse aucun pgpass dans le ConfigMap pgAdmin
    templates:
      - templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: test-pgadmin-pg-config
    asserts:
      - notExists:
          path: data["pgpass"]
      - exists:
          path: data["servers.json"]

  # --- Garde-fous ---
  # L'alias est résolu dès `commons.withAddons`, donc dès le premier template
  # rendu — d'où l'assertion portée sur celui-ci plutôt que sur le deployment.
  - it: Échoue explicitement sur un alias inconnu
    templates:
      - templates/cnpg/secret.yaml
    set:
      addons.redis.passwordSecretRef: inconnu
    asserts:
      - failedTemplate:
          errorPattern: "l'alias `inconnu` est référencé mais absent de la section `secrets`"

  - it: Échoue si on tente de lire le mot de passe en clair d'un cluster externe
    values:
      - ./values/external-secrets-plaintext-values.yaml
    templates:
      - templates/deployment.yaml
    asserts:
      - failedTemplate:
          errorPattern: "est indisponible quand le cluster utilise `cluster.secretRef`"
