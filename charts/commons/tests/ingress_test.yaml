# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Tests complets du chart commons
values:
  - ./values/values.yaml
templates:
  - templates/ingress.yaml
release:
  name: test
tests:
  # --- Ingress ---
  - it: Vérifie l'Ingress web
    documentSelector:
      path: metadata.name
      value: test-nginx
    asserts:
      - equal:
          path: spec.rules[0].host
          value: web.mondomaine.local
      - equal:
          path: spec.tls[0].secretName
          value: web-cert
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: test-nginx
      - equal:
          path: spec.ingressClassName
          value: traefik

  - it: utilise le className global quand non défini sur le component
    set:
      components:
        - name: no-classname-app
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
          service:
            ports:
              - name: http
                port: 80
          ingress:
            enabled: true
            hosts:
              - host: noclassname.local
                paths:
                  - path: /
    documentSelector:
      path: metadata.name
      value: test-no-classname-app
    asserts:
      - equal:
          path: spec.ingressClassName
          value: traefik