# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Résolution de la section `secrets` (__secrets__<clé>)
values:
  - ./values/secrets-values.yaml
release:
  name: test
tests:
  # --- Postgres embarqué dans un component ---
  - it: Résout __secrets__ dans le Secret Postgres d'un component
    templates:
      - templates/cnpg/secret.yaml
    documentSelector:
      path: metadata.name
      value: test-app-postgres-secret
    asserts:
      - equal:
          path: data.password
          value: cGctczNjcjN0
      - equal:
          path: data.username
          value: YXBwdXNlcg==

  # --- Postgres partagé (addon) : passthrough ---
  - it: Laisse intacte une valeur en clair dans le Secret Postgres partagé
    templates:
      - templates/cnpg/secret.yaml
    documentSelector:
      path: metadata.name
      value: test-postgres-secret
    asserts:
      - equal:
          path: data.password
          value: cGxhaW4tbm90LXBsYWNlaG9sZGVy
      - equal:
          path: data.username
          value: c2hhcmVkYWRtaW4=

  # --- Secrets déclarés sur un component ---
  - it: Résout __secrets__ dans les `secrets[].data` d'un component
    templates:
      - templates/secret.yaml
    documentSelector:
      path: metadata.name
      value: test-app-creds
    asserts:
      - equal:
          path: data.apiKey
          value: YXBpLXMzY3IzdA==
      - equal:
          path: data.plain
          value: bm90LWEtc2VjcmV0

  # --- Addon Redis ---
  - it: Résout __secrets__ dans le Secret Redis
    templates:
      - templates/secret.yaml
    documentSelector:
      path: metadata.name
      value: test-redis-auth
    asserts:
      - equal:
          path: data.password
          value: cmVkaXMtczNjcjN0

  # --- Variables d'environnement des components ---
  - it: Résout __secrets__ dans les env d'un component (direct et indirect)
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: test-app
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY_INLINE
            value: api-s3cr3t
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PG_PASSWORD_INDIRECT
            value: pg-s3cr3t
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: API_KEY
            valueFrom:
              secretKeyRef:
                name: test-app-creds
                key: apiKey

  # --- Addon pgAdmin ---
  - it: Résout __secrets__ dans le mot de passe pgAdmin
    templates:
      - templates/deployment.yaml
    documentSelector:
      path: metadata.name
      value: test-pgadmin
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: PGADMIN_DEFAULT_PASSWORD
            value: pgadmin-s3cr3t

  # --- Résolution transitive dans le pgpass généré ---
  - it: Résout __secrets__ de façon transitive dans le pgpass de pgAdmin
    templates:
      - templates/configmap.yaml
    documentSelector:
      path: metadata.name
      value: test-pgadmin-pg-config
    asserts:
      - matchRegex:
          path: data["pgpass"]
          pattern: test-app-postgres-rw:5432:postgres:appuser:pg-s3cr3t

  # --- Garde-fou : clé absente ---
  - it: Échoue explicitement si la clé référencée est absente de `secrets`
    templates:
      - templates/secret.yaml
    set:
      addons.redis.password: __secrets__inconnue
    asserts:
      - failedTemplate:
          errorPattern: "la clé `inconnue` est référencée via `__secrets__inconnue` mais absente de la section `secrets`"
