# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Tests complets du chart commons
values:
  - ./values/values.yaml
release:
  name: test
tests:
  # --- Secret ---
  - it: Vérifie le Secret rbac
    templates:
      - templates/rbac/secret.yaml
    documentSelector:
      path: metadata.name
      value: homepage-secret
    asserts:
      - equal:
          path: type
          value: kubernetes.io/service-account-token
      - equal:
          path: metadata.annotations["kubernetes.io/service-account.name"]
          value: homepage
          
  - it: Vérifie le service account rbac
    templates:
      - templates/rbac/serviceaccount.yaml
    documentSelector:
      path: metadata.name
      value: homepage
    asserts:
      - equal:
          path: kind
          value: ServiceAccount
      - equal:
          path: secrets[0].name
          value: homepage-secret
          
          
  - it: Vérifie le culsterrole rbac
    templates:
      - templates/rbac/clusterrole.yaml
    documentSelector:
      path: metadata.name
      value: homepage
    asserts:
      - equal:
          path: kind
          value: ClusterRole
      - equal:
          path: rules[0].resources[1]
          value: pods
      - equal:
          path: rules[1].apiGroups[0]
          value: extensions 
      - equal:
          path: rules[3].verbs[1]
          value: list

  - it: Vérifie le culster role binding rbac
    templates:
      - templates/rbac/clusterrolebinding.yaml
    documentSelector:
      path: metadata.name
      value: homepage
    asserts:
      - equal:
          path: kind
          value: ClusterRoleBinding
      - equal:
          path: roleRef.name
          value: homepage
      - equal:
          path: subjects[0].name
          value: homepage

  - it: ne crée aucune ressource RBAC quand désactivé
    set:
      global:
        rbac:
          enabled: false
    templates:
      - templates/rbac/secret.yaml
      - templates/rbac/serviceaccount.yaml
      - templates/rbac/clusterrole.yaml
      - templates/rbac/clusterrolebinding.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: "exclut du ServiceAccount un component qui pose `rbac: false`"
    templates:
      - templates/deployment.yaml
    set:
      components:
        - name: no-rbac
          rbac: false
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
        - name: with-rbac
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
    asserts:
      - documentSelector:
          path: metadata.name
          value: test-no-rbac
        notExists:
          path: spec.template.spec.serviceAccountName
      - documentSelector:
          path: metadata.name
          value: test-no-rbac
        equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - documentSelector:
          path: metadata.name
          value: test-with-rbac
        equal:
          path: spec.template.spec.serviceAccountName
          value: homepage

  - it: "exclut du ServiceAccount un addon qui pose `rbac: false`"
    templates:
      - templates/deployment.yaml
    set:
      addons.redis.rbac: false
    documentSelector:
      path: metadata.name
      value: test-redis
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: "exclut aussi les cronjobs d'un component `rbac: false`"
    templates:
      - templates/cronjob.yaml
    set:
      components:
        - name: no-rbac
          rbac: false
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
          cronjobs:
            - name: task
              enabled: true
              schedule: "0 3 * * *"
              containers:
                - image:
                    repository: alpine
                    tag: latest
    documentSelector:
      path: metadata.name
      value: test-no-rbac-task
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
      - equal:
          path: spec.jobTemplate.spec.template.spec.automountServiceAccountToken
          value: false

  - it: "ne crée pas le Secret de token avec `createTokenSecret: false`"
    templates:
      - templates/rbac/secret.yaml
      - templates/rbac/serviceaccount.yaml
    set:
      global.rbac.createTokenSecret: false
    asserts:
      - template: templates/rbac/secret.yaml
        hasDocuments:
          count: 0
      - template: templates/rbac/serviceaccount.yaml
        notExists:
          path: secrets
