# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: Tests complets du chart commons
values:
  - ./values/values.yaml
templates:
  - templates/deployment.yaml
release:
  name: test
tests:
 # --- Deployments ---
  - it: Vérifie le Deployment web
    documentSelector:
      path: metadata.name
      value: test-nginx
    asserts:
      - equal:
          path: spec.replicas
          value: 2
      - equal:
          path: spec.template.spec.containers[0].image
          value: nginx:latest
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 80
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 20
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1001
      - equal:
          path: spec.template.spec.securityContext.supplementalGroups[0]
          value: 10
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: setup-volume
      - equal:
          path: spec.template.spec.initContainers[1].name
          value: wait-for-redis
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[3].name
          value: wait-for-postgres-nginx

  - it: Vérifie les variables d'env
    documentSelector:
      path: metadata.name
      value: test-nginx
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[0].value
          value: Europe/Paris
      - equal:
          path: spec.template.spec.containers[0].env[1].value
          value: prod
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: changeme
      - equal:
          path: spec.template.spec.containers[0].env[3].valueFrom.secretKeyRef.name
          value: test-nginx-postgres-secret

  - it: Vérifie les prots
    documentSelector:
      path: metadata.name
      value: test-nginx
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80
      - equal:
          path: spec.template.spec.containers[0].ports[1].name
          value: http2
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 8080

  - it: Vérifie les volumes
    documentSelector:
      path: metadata.name
      value: test-nginx
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: test-nginx-data-pvc
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].subPath
          value: data
  - it: Vérifie le Deployment vscode
    documentSelector:
      path: metadata.name
      value: test-code-server
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 1001
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 0
      - equal:
          path: spec.template.spec.containers[0].env[2].value
          value: "0"
      - equal:
          path: spec.template.spec.containers[0].image
          value: lscr.io/linuxserver/code-server:4.104.2
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: "/config"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: "vscode-config"
      - equal:
          path: spec.template.spec.volumes[0].name
          value: "vscode-config"
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: "test-code-server-vscode-config"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].mountPath
          value: "/config/workspace/toto"
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[1].name
          value: "toto"
      - equal:
          path: spec.template.spec.volumes[1].name
          value: "toto"
      - equal:
          path: spec.template.spec.volumes[1].persistentVolumeClaim.claimName
          value: "test-nginx-data-2-pvc"

  - it: Vérifie le Deployment redis
    documentSelector:
      path: metadata.name
      value: test-redis
    asserts:
      - equal:
          path: spec.replicas
          value: 1
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 1000
      - notExists:
          path: spec.template.spec.containers[0].securityContext.runAsUser
      - equal:
          path: spec.template.spec.containers[0].image
          value: redis:8.2.1
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --requirepass
            - $(REDIS_PASSWORD)
      - equal:
          path: spec.template.spec.containers[0].env[1].name
          value: REDIS_PASSWORD
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.name
          value: test-redis-auth
      - equal:
          path: spec.template.spec.containers[0].env[1].valueFrom.secretKeyRef.key
          value: password

  - it: ne doit pas créer le Service Redis si désactivé
    set:
      addons:
        redis:
          enabled: false
    asserts:
      - hasDocuments:
          count: 3

  - it: ne doit pas créer le Service Vscode si désactivé
    set:
      addons:
        vscode:
          enabled: false
    asserts:
      - hasDocuments:
          count: 3

  - it: n'ajoute les ports du Service que sur le premier conteneur d'un deployment multi-conteneurs
    set:
      components:
        - name: multi
          deployment:
            containers:
              - image:
                  repository: primary
                  tag: latest
              - image:
                  repository: sidecar
                  tag: latest
          service:
            ports:
              - name: http
                port: 8081
    documentSelector:
      path: metadata.name
      value: test-multi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].name
          value: http
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 8081
      - notExists:
          path: spec.template.spec.containers[1].ports

  - it: référence un PVC et un ConfigMap déjà existants (useExisting)
    set:
      components:
        - name: existing-refs
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
            volumes:
              - name: data
                pvc:
                  useExisting: true
                  name: my-existing-pvc
              - name: config
                configMap:
                  useExisting: true
                  name: my-existing-configmap
    documentSelector:
      path: metadata.name
      value: test-existing-refs
    asserts:
      - equal:
          path: spec.template.spec.volumes[0].persistentVolumeClaim.claimName
          value: my-existing-pvc
      - equal:
          path: spec.template.spec.volumes[1].configMap.name
          value: my-existing-configmap

  - it: passe un volume brut (ni configMap ni pvc) tel quel
    set:
      components:
        - name: raw-volume-app
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
            volumes:
              - name: cache
                emptyDir: {}
    documentSelector:
      path: metadata.name
      value: test-raw-volume-app
    asserts:
      - equal:
          path: spec.template.spec.volumes[0]
          value:
            name: cache
            emptyDir: {}

  - it: rend les resources des initContainers (wait-for-postgres et initContainer utilisateur)
    set:
      components:
        - name: init-res
          deployment:
            initContainers:
              - name: prepare
                image:
                  repository: alpine
                resources:
                  limits:
                    memory: 64Mi
            containers:
              - image:
                  repository: nginx
                  tag: latest
    documentSelector:
      path: metadata.name
      value: test-init-res
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].resources
          value:
            limits:
              memory: 64Mi
      - equal:
          path: spec.template.spec.initContainers[2].name
          value: wait-for-postgres
      - equal:
          path: spec.template.spec.initContainers[2].resources
          value:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi

  - it: rend les variables d'env valant "", 0 ou false
    set:
      components:
        - name: falsy-env
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
                env:
                  - name: EMPTY
                    value: ""
                  - name: ZERO
                    value: 0
                  - name: DISABLED
                    value: false
    documentSelector:
      path: metadata.name
      value: test-falsy-env
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env[1]
          value:
            name: EMPTY
            value: ""
      - equal:
          path: spec.template.spec.containers[0].env[2]
          value:
            name: ZERO
            value: "0"
      - equal:
          path: spec.template.spec.containers[0].env[3]
          value:
            name: DISABLED
            value: "false"

  - it: rend strategy.rollingUpdate quand il est fourni
    set:
      components:
        - name: rolling
          deployment:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 0
                maxUnavailable: 1
            containers:
              - image:
                  repository: nginx
                  tag: latest
    documentSelector:
      path: metadata.name
      value: test-rolling
    asserts:
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1

  - it: pose le checksum d'un ConfigMap en annotation du pod, pas en label
    set:
      components:
        - name: cm-app
          deployment:
            containers:
              - image:
                  repository: nginx
                  tag: latest
            volumes:
              - name: conf
                configMap:
                  data:
                    app.conf: "a=1"
    documentSelector:
      path: metadata.name
      value: test-cm-app
    asserts:
      - matchRegex:
          path: spec.template.metadata.annotations["checksum/conf"]
          pattern: ^[0-9a-f]{64}$
      - notExists:
          path: spec.template.metadata.labels["checksum/conf"]
