# Table d'alias vers des Secrets Kubernetes DÉJÀ présents dans le namespace
# (SealedSecret, ExternalSecret, secret créé à la main...). Aucune valeur
# sensible ne transite par Helm : seule la référence est stockée.
#   secrets:
#     pg:
#       existingSecret: app-pg-credentials
#       key: password
secrets: {}

global:
  timezone: "Europe/Paris"
  pvc:
    storage:
      size: "1Gi"
      storageClassName: ""
      accessMode: "ReadWriteOnce" 
  ingress:
    className: traefik
  rbac:
    enabled: false

addons:
  vscode:
    enabled: false
    image:
      repository: lscr.io/linuxserver/code-server
      tag: 4.132.0
    service:
      port: 8443
    ingress:
      enabled: false
  redis:
    enabled: false
    name: redis
    image:
      repository: redis
      tag: 8.10.0-alpine
    port: 6379
    password: ""
    # `passwordSecretRef: <alias>` (section `secrets`) remplace `password`.
  pgadmin:
    enabled: false
    image:
      repository: dpage/pgadmin4
      tag: 9.15.0
    auth:
      email: test@test.com
      password: changeme
      # `passwordSecretRef: <alias>` (section `secrets`) remplace `password`.
    ingress:
      enabled: false
    service:
      port: 80
  postgres:
    enabled: false
    storage:
      size: "1Gi"
      storageClassName: ""
    image:
      repository: ghcr.io/cloudnative-pg/postgresql
      tag: 18
    cluster:
      username: changeme
      password: changeme