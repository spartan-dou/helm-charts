{{/*
  Job "one-shot" doublant un cronjob marqué `runOnStartup: true`, pour exécuter
  la tâche dès le déploiement sans attendre la prochaine occurrence.
*/}}
{{- $components := include "commons.withAddons" . | fromYamlArray }}
{{- range $components }}
{{- $component := . }}
{{- range $component.cronjobs }}
{{- if and .runOnStartup .enabled}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "commons.fullname" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "name" .name "component" $component) }}
  labels:
    {{- include "commons.labels" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "name" .name "component" $component) | nindent 4 }}
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: {{ default "Never" .restartPolicy }}
      {{- if $.Values.global.rbac.enabled }}
      serviceAccountName: {{ $.Values.global.rbac.serviceAccountName }}
      automountServiceAccountToken: true
      {{- end }}

      {{- include "commons.pod.securityContext" (dict "global" $.Values.global "securityContext" .securityContext) | nindent 6 }}

      {{- with .nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .initContainers }}
      initContainers:
        {{- range . }}
        - name: {{ .name | default $component.name }}
          image: {{ .image.repository }}:{{ .image.tag | default "latest" }}
          {{- if .container }}
            {{- with .container.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .container.capabilities }}
          capabilities:
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "commons.containers.env" (dict "Values" $.Values "Chart" $.Chart "Release" $.Release "component" $component "env" .env) | nindent 10 }}
          {{- with .volumeMounts }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- with .subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- with .containers }}
      containers:
        {{- range . }}
        - name: {{ default $component.name .name }}
          image: {{ .image.repository }}:{{ .image.tag | default "latest" }}
          {{- with .command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "commons.containers.env" (dict "Values" $.Values "Chart" $.Chart "Release" $.Release "component" $component "env" .env) | nindent 10 }}
          {{- with .lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .volumeMounts }}
          volumeMounts:
            {{- range . }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- with .subPath }}
              subPath: {{ . }}
              {{- end }}
            {{- end }}
          {{- end }}
          {{- with .resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}

      {{- with .volumes }}
      volumes:
        {{- range . }}
          {{- if .configMap }}
        - name: {{ .name }}
          configMap:
            {{- if .configMap.useExisting }}
            name: {{ include "commons.getValue" (dict "Values" $.Values "Chart" $.Chart "Release" $.Release "component" $component "value" .configMap.name) }}
            {{- else }}
            name: {{ include "commons.fullname" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "name" (default .name .configMap.name) "component" $component) }}
            {{- end }}
            {{- with .configMap.readOnly }}
            readOnly: {{ . }}
            {{- end }}
          {{- else if .pvc }}
        - name: {{ .name }}
          persistentVolumeClaim:
            {{- if .pvc.useExisting }}
            claimName: {{ include "commons.getValue" (dict "Values" $.Values "Chart" $.Chart "Release" $.Release "component" $component "value" .pvc.name) }}
            {{- else }}
            claimName: {{ include "commons.fullname" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "name" (default .name .pvc.name) "component" $component) }}
            {{- end }}
            {{- with .pvc.readOnly }}
            readOnly: {{ . }}
            {{- end }}
          {{- else }}
        - {{ toYaml . | nindent 10 | trim }}
          {{- end }}
        {{- end }}
      {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
