{{/*
  Un Cluster CloudNativePG par `postgres.enabled`, qu'il soit embarqué dans un
  component ou partagé via `addons.postgres`.
*/}}
{{- $components := include "commons.withAddons" . | fromYamlArray }}
{{- $raw := .Values.addons | default dict }}
{{- $components = append $components $raw }}
{{- range $components }}
{{- $component := . }}
{{- with $component.postgres }}
{{- if .enabled }}
{{- $clusterName := printf "%s-postgres" (include "commons.fullname" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "name" .name "component" $component)) }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ $clusterName }}
  labels:
    app.kubernetes.io/name: {{ .name | default "postgres" }}
    app.kubernetes.io/instance: {{ .name | default "postgres" }}
spec:
  instances: {{ .instances | default 1 }}
  postgresql:
    parameters:
      timezone: {{ $.Values.global.timezone }}

  {{- with .resources }}
  resources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .priorityClassName }}
  priorityClassName: {{ . }}
  {{- end }}
  storage:
    size: {{ default $.Values.addons.postgres.storage.size (default dict .storage).size }}
    storageClass: {{ default $.Values.addons.postgres.storage.storageClassName (default dict .storage).storageClassName }}
  {{- $pgImage := include "commons.postgres.image" (dict "Values" $.Values "postgres" .) | fromYaml }}
  imageName: {{ $pgImage.repository }}:{{ $pgImage.tag }}

  bootstrap:
    initdb:
      database: {{ .cluster.database | default "app" }}
      owner: {{ .cluster.username | default "app" }}
      secret:
        {{- if .cluster.secretRef }}
        name: {{ include "commons.secretRefName" (dict "Values" $.Values "alias" .cluster.secretRef) }}
        {{- else }}
        name: {{ include "commons.fullname" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "name" .name "component" $component) }}-postgres-secret
        {{- end }}
      {{- with .postInitTemplateSQL }}
      postInitTemplateSQL:
        {{- range . }}
        - {{ . }}
        {{- end }}
      {{- end }}
      {{- with .postInitSQL }}
      postInitSQL:
        {{- range . }}
        - {{ . }}
        {{- end }}
      {{- end }}
      {{- with .postInitApplicationSQL }}
      postInitApplicationSQL:
        {{- range . }}
        - {{ . }}
        {{- end }}
      {{- end }}

  {{- with .backup }}
  backup:
    barmanObjectStore:
      {{- /* Chemin et Secret dérivés du nom du Cluster : deux clusters qui
             partagent un bucket ne s'écrasent pas. */}}
      destinationPath: {{ .destinationPath | trimSuffix "/" }}/{{ $clusterName }}
      endpointURL: {{ .endpointURL }}
      s3Credentials:
        accessKeyId:
          name: {{ $clusterName }}-backup-secret
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: {{ $clusterName }}-backup-secret
          key: SECRET_ACCESS_KEY
      wal:
        compression: gzip
        maxParallel: 4
      data:
        compression: gzip
  {{- end }}

  monitoring:
    enablePodMonitor: {{ .monitoring | default false }}
---
{{- end }}
{{- end }}
{{- end }}
