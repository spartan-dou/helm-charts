{{/*
  Secret `basic-auth` des identifiants d'un Cluster CloudNativePG généré par la
  chart.
*/}}
{{- $components := include "commons.withAddons" . | fromYamlArray }}
{{- $raw := .Values.addons | default dict }}
{{- $components = append $components $raw }}
{{- range $components }}
{{- $component := . }}
{{- with $component.postgres }}
{{- /*
  Avec `cluster.secretRef`, les identifiants vivent dans un Secret déjà présent
  dans le namespace : la chart n'en génère aucun et se contente d'y pointer.
*/}}
{{- if and .enabled (not (default dict .cluster).secretRef) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "commons.fullname" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "name" .name "component" $component) }}-postgres-secret
  labels:
    {{- include "commons.labels" (dict "Chart" $.Chart "Values" $.Values "Release" $.Release "name" .name "component" $component) | nindent 4 }}
type: kubernetes.io/basic-auth
data:
  username: {{ .cluster.username | b64enc | quote }}
  password: {{ .cluster.password | b64enc | quote }}
---
{{- end }}
{{- end }}
{{- end }}
